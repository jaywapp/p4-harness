[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p4-harness"
version = "0.1.0"
description = "Shared Perforce task workflow for Claude Code and Codex"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
p4h = "p4_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p4_harness = ["templates/*.md", "templates/p4-work/*.md"]
