<polyline points="102.675,510.8 92.925,522.5 102.675,534.2" fill="none" stroke="#5368AF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="116.325,510.8 126.07499999999999,522.5 116.325,534.2" fill="none" stroke="#5368AF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
