<text x="509.0" y="471" font-size="19" font-weight="600" fill="#9EE1D5" text-anchor="middle">01</text>
<text x="558" y="467" font-size="27" font-weight="650" fill="#FFFFFF" text-anchor="start">범위·소유권 확인</text>
<text x="558" y="504" font-size="21" font-weight="400" fill="#BBD1DF" text-anchor="start">client · root · 작업 범위 확인</text>
<rect x="480" y="536" width="58" height="40" rx="20" fill="#29475A"/>
<text x="509.0" y="564" font-size="19" font-weight="600" fill="#9EE1D5" text-anchor="middle">02</text>
<text x="558" y="560" font-size="27" font-weight="650" fill="#FFFFFF" text-anchor="start">수정 전 파일 준비</text>
<text x="558" y="597" font-size="21" font-weight="400" fill="#BBD1DF" text-anchor="start">기존 파일 checkout · 새 파일 예약</text>
<rect x="480" y="629" width="58" height="40" rx="20" fill="#29475A"/>
<text x="509.0" y="657" font-size="19" font-weight="600" fill="#9EE1D5" text-anchor="middle">03</text>
<text x="558" y="653" font-size="27" font-weight="650" fill="#FFFFFF" text-anchor="start">현재 파일에 검증 연결</text>
<text x="558" y="690" font-size="21" font-weight="400" fill="#BBD1DF" text-anchor="start">snapshot · 필수 검사 결과 확인</text>
<rect x="480" y="726" width="526" height="43" rx="12" fill="#244657"/>
<text x="743" y="755" font-size="22" font-weight="650" fill="#B9F1E4" text-anchor="middle">p4.exe 실행</text>
