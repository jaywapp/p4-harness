<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">p4-harness 핵심 아이디어</title><desc id="desc">Claude Code와 Codex가 공통 규칙, 훅, Python CLI를 통해 p4.exe를 사용한다. 하나의 작업은 하나의 CL에 모으고, 기존 변경을 보존하며 현재 파일과 검증 결과를 연결한다.</desc>
<style>text {font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}</style>
<rect width="1600" height="1200" fill="#F5F8FB"/>
<text x="64" y="62" font-size="19" font-weight="700" fill="#147A70" text-anchor="start">01 / HARNESS CORE IDEAS</text>
<text x="64" y="134" font-size="60" font-weight="750" fill="#172D43" text-anchor="start">p4-harness</text>
<text x="65" y="190" font-size="31" font-weight="500" fill="#566A7E" text-anchor="start">에이전트가 달라도, P4 작업 규칙은 하나로.</text>
