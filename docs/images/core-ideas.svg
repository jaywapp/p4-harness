<text x="1126" y="279" font-size="23" font-weight="650" fill="#566A7E" text-anchor="start">같은 변경 단위로 관리</text>
<rect x="64" y="318" width="306" height="128" rx="24" fill="#FFFFFF" stroke="#D7E2EC" stroke-width="2"/>
<polyline points="102.675,356.8 92.925,368.5 102.675,380.2" fill="none" stroke="#B55F44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="116.325,356.8 126.07499999999999,368.5 116.325,380.2" fill="none" stroke="#B55F44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
