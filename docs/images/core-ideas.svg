<text x="147" y="566" font-size="21" font-weight="450" fill="#566A7E" text-anchor="start">구현 · 수정 · 검토</text>
<polyline points="374.0,382.0 408.0,382.0 408.0,451.0 440.0,451.0" fill="none" stroke="#147A70" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="440.00,451.00 429.59,456.96 429.59,445.04" fill="#147A70"/>
<polyline points="374.0,536.0 408.0,536.0 408.0,451.0" fill="none" stroke="#147A70" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="68" y="667" font-size="23" font-weight="500" fill="#566A7E" text-anchor="start">같은 워크스페이스에서는</text>
<text x="68" y="705" font-size="23" font-weight="500" fill="#566A7E" text-anchor="start">한 번에 한 작성자</text>
