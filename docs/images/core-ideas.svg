<text x="92" y="976" font-size="22" font-weight="450" fill="#566A7E" text-anchor="start">다른 작업의 파일을 가져오지 않음</text>
<rect x="566" y="858" width="468" height="170" rx="24" fill="#FFFFFF" stroke="#D7E2EC" stroke-width="2"/>
<polyline points="595.8,895.9 612.0,887.8 628.2,895.9 612.0,904.0 595.8,895.9" fill="none" stroke="#147A70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="595.8,904.9 612.0,913.0 628.2,904.9" fill="none" stroke="#147A70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="595.8,913.0 612.0,921.1 628.2,913.0" fill="none" stroke="#147A70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="648" y="917" font-size="27" font-weight="700" fill="#172D43" text-anchor="start">필요한 정보만 조회</text>
<text x="594" y="976" font-size="22" font-weight="450" fill="#566A7E" text-anchor="start">요약 · 변경분 먼저, 원본은 보관</text>
<rect x="1068" y="858" width="468" height="170" rx="24" fill="#FFFFFF" stroke="#D7E2EC" stroke-width="2"/>
<polyline points="1100.5,904.9 1109.5,913.9 1127.5,893.2" fill="none" stroke="#147A70" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1150" y="917" font-size="27" font-weight="700" fill="#172D43" text-anchor="start">오래된 검증 차단</text>
<text x="1096" y="976" font-size="22" font-weight="450" fill="#566A7E" text-anchor="start">현재 파일 상태와 검사 결과를 비교</text>
<text x="65" y="1071" font-size="27" font-weight="650" fill="#147A70" text-anchor="start">모델이 바뀌어도 파일 준비·CL·검증의 기준은 유지합니다.</text>
<polyline points="64.0,1110.0 1536.0,1110.0" fill="none" stroke="#D7E2EC" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64" y="1157" font-size="23" font-weight="550" fill="#172D43" text-anchor="start">P4V·p4.exe 위에서 에이전트의 작업 절차를 일관되게 관리</text>
<text x="1536" y="1157" font-size="18" font-weight="500" fill="#566A7E" text-anchor="end">p4-harness</text>
</svg>
