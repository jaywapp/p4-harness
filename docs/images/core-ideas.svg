<text x="1220" y="369" font-size="27" font-weight="750" fill="#147A70" text-anchor="start">작업 1개 = CL 1개</text>
<text x="1160" y="417" font-size="23" font-weight="500" fill="#172D43" text-anchor="start">하위 작업도 같은 CL 유지</text>
<rect x="1156" y="452" width="348" height="200" rx="20" fill="#FFFFFF"/>
<rect x="1173" y="474" width="66" height="40" rx="20" fill="#ECF6F1"/>
<text x="1206.0" y="502" font-size="18" font-weight="600" fill="#147A70" text-anchor="middle">T01</text>
<text x="1257" y="502" font-size="23" font-weight="550" fill="#172D43" text-anchor="start">첫 번째 변경</text>
<rect x="1173" y="531" width="66" height="40" rx="20" fill="#ECF6F1"/>
<text x="1206.0" y="559" font-size="18" font-weight="600" fill="#147A70" text-anchor="middle">T02</text>
<text x="1257" y="559" font-size="23" font-weight="550" fill="#172D43" text-anchor="start">다음 변경</text>
<rect x="1173" y="588" width="66" height="40" rx="20" fill="#ECF6F1"/>
<text x="1206.0" y="616" font-size="18" font-weight="600" fill="#147A70" text-anchor="middle">FIX</text>
<text x="1257" y="616" font-size="23" font-weight="550" fill="#172D43" text-anchor="start">수정·보완</text>
<text x="1161" y="695" font-size="23" font-weight="600" fill="#147A70" text-anchor="start">인계해도 작업 CL 유지</text>
<text x="1161" y="736" font-size="21" font-weight="450" fill="#566A7E" text-anchor="start">완료: 보고서 + pending CL</text>
<text x="1161" y="767" font-size="21" font-weight="450" fill="#566A7E" text-anchor="start">submit은 기존 절차에서</text>
<rect x="64" y="858" width="468" height="170" rx="24" fill="#FFFFFF" stroke="#D7E2EC" stroke-width="2"/>
<polyline points="110.0,887.8 123.5,893.2 121.7,908.5 110.0,920.2 98.3,908.5 96.5,893.2 110.0,887.8" fill="none" stroke="#147A70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
